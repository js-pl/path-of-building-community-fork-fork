name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - run: sync/check.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The engine without the translation, as the browser ships it
      - run: cargo clippy -p session -p wasm --no-default-features -- -D warnings
      # Generated ports must match upstream's source
      - run: cargo run --release -p importer --bin portgen
      - run: cargo run --release -p importer --bin synthlines
      - run: git diff --exit-code -- crates/engine/src/mod_parser/generated.rs corpus/synthetic_mod_lines.txt

  # The tests, built once in release (the equivalence tests are slow in
  # debug builds); sccache keeps the crates whose sources did not change,
  # the translated program above all, over runs and jobs
  build:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest archive --release --workspace --archive-file tests.tar.zst
      - run: cargo test --release --doc
      - run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0

  # The tests on runners of their own. The session test's shards split over
  # three runners and the perform tests' over two (TEST_SHARD_PARTITION), the
  # other tests three, by binary, about 4 minutes of a single test at a time
  # each (equivalence tests side by side on one runner are about three times
  # slower each: the runner's CPU is the limit). Every test runs on one of
  # them: `rest` takes what the others leave.
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: session 1/3
            filter: 'test(=typed_session_matches_translated)'
            shards: 1/3
          - name: session 2/3
            filter: 'test(=typed_session_matches_translated)'
            shards: 2/3
          - name: session 3/3
            filter: 'test(=typed_session_matches_translated)'
            shards: 3/3
          - name: perform 1/2
            filter: 'binary(=perform)'
            shards: 1/2
          - name: perform 2/2
            filter: 'binary(=perform)'
            shards: 2/2
          - name: setup and breakdowns
            filter: 'binary(=calculator) | binary(=calc_setup) | binary(=breakdown) | binary(=build_output) | binary(=bench) | binary(=mod_cache) | binary(=data)'
          - name: items, config and skills
            filter: 'binary(=item) | binary(=items_tab) | binary(=config) | binary(=calcs) | binary(=skills) | binary(=tree)'
          - name: rest
            filter: 'not (test(=typed_session_matches_translated) | binary(=perform) | binary(=calculator) | binary(=calc_setup) | binary(=breakdown) | binary(=build_output) | binary(=bench) | binary(=mod_cache) | binary(=data) | binary(=item) | binary(=items_tab) | binary(=config) | binary(=calcs) | binary(=skills) | binary(=tree))'
    name: test (${{ matrix.name }})
    env:
      TEST_SHARD_PARTITION: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - run: cargo nextest run --profile ci --archive-file tests.tar.zst --workspace-remap . -E '${{ matrix.filter }}'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  # The browser engine gives the same results as the native one, with the
  # translation and without (--typed)
  wasm:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release -p cli
      - run: node web/scripts/build-wasm.mjs
      - run: node web/scripts/build-data.mjs
      - run: node --test web/tests/*.test.mjs
      - run: node web/scripts/build-wasm.mjs --typed
      - run: node --test web/tests/*.test.mjs
      - run: sccache --show-stats

  # The generator reproduces corpus/generated, and upstream reproduces
  # tests/oracle exactly, in two runs with different hash seeds
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-oracle
      - run: oracle/run.py generate
      - run: git status --porcelain -- corpus/generated && test -z "$(git status --porcelain -- corpus/generated)"
      - run: oracle/run.py check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-oracle
      - run: oracle/run.py coverage --out target/oracle-coverage
      - run: |
          echo '### Oracle line coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat target/oracle-coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-coverage
          path: |
            target/oracle-coverage/summary.txt
            target/oracle-coverage/uncovered.txt
            target/oracle-coverage/luacov.report.out
