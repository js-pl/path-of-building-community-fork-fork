name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Upstream reproduces tests/oracle exactly, in two processes with different
  # hash seeds
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-oracle
      - run: oracle/run.py check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-oracle
      - run: oracle/run.py coverage --out target/oracle-coverage
      - run: |
          echo '### Oracle line coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat target/oracle-coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-coverage
          path: |
            target/oracle-coverage/summary.txt
            target/oracle-coverage/uncovered.txt
            target/oracle-coverage/luacov.report.out

  # Shared runners are noisy, so benchmarks are not run on pull requests
  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-oracle
      - run: oracle/run.py bench --out target/oracle-bench.json --repeats 5
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-bench
          path: target/oracle-bench.json
