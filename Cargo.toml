[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/js-pl/path-of-building-community-fork-fork"
# Not published: the name belongs to the PoB Community project, see README.
publish = false

[workspace.dependencies]
lua = { path = "crates/lua" }
importer = { path = "crates/importer" }
engine = { path = "crates/engine" }
upstream = { path = "crates/upstream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# luagen runs in crates/upstream's build script; optimised, it takes seconds
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# The browser build (web/scripts/build-wasm.mjs): no symbols, as served
[profile.web]
inherits = "release"
strip = true
