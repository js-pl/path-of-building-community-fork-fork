[package]
name = "upstream"
description = "Upstream's Lua program translated to Rust by luagen, and the headless host that runs it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No unit tests or doc tests: `cargo test` would compile the translated
# program a second time, as a test harness, for nothing
[lib]
test = false
doctest = false

[dependencies]
lua.workspace = true
importer.workspace = true

[build-dependencies]
importer.workspace = true
