[package]
name = "wasm"
description = "The engine API for the browser: a C ABI over session, see docs/design.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["translation"]
# Commands the typed engine does not have yet fall back to upstream's
# translated program; without it they are "not ported" errors and the
# module holds neither the translation nor the Lua runtime
translation = ["session/translation"]

[dependencies]
session = { path = "../session", default-features = false }
