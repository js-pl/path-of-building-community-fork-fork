[package]
name = "host"
description = "pob host: owns the builds on disk with their history and serves the agent API on a control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent = { path = "../agent" }
history = { path = "../history" }
session = { path = "../session", default-features = false }
serde_json.workspace = true
# TLS for MCP over HTTP off loopback, with ring for tokens' randomness and hashes
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

[dev-dependencies]
session = { path = "../session", default-features = false, features = ["source"] }

# The control socket on Windows: a named pipe only the user can open
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
