[package]
name = "session"
description = "Engine API: build sessions on the typed engine, see docs/design.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["source"]
# The typed data made from upstream's source directory
# (`TypedData::from_source`), for native runs and tests
source = ["dep:gamedata"]

[dependencies]
lua.workspace = true
engine.workspace = true
gamedata = { workspace = true, optional = true }
serde_json.workspace = true
miniz_oxide = "0.9"

[build-dependencies]
importer.workspace = true
lua.workspace = true
serde_json.workspace = true

[dev-dependencies]
testkit.workspace = true
equivalence = { path = "../equivalence" }

[[test]]
name = "session"
required-features = ["source"]

[[test]]
name = "typed"
required-features = ["source"]
