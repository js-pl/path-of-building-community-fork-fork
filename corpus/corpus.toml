# Builds the oracle runs. Paths are relative to the repository root.
#
# Generated builds come from corpus/generate.lua (`oracle/run.py generate`),
# one per seed, written to corpus/generated/gen-<seed>.xml. They cycle through
# every class and ascendancy and every kind of main skill, with random trees,
# uniques and rares, jewels, flasks, supports, configs, minions and Full DPS.
[generated]
first_seed = 1
count = 56

# Each build records where it comes from and under which license, see
# docs/design.md#corpus. Builds may be PoB XML (.xml) or PoE API character
# JSON (.json).

[[build]]
id = "3.13-dual-savior"
path = "upstream/PathOfBuilding/spec/TestBuilds/3.13/Dual Savior.xml"
source = "upstream spec/TestBuilds"
license = "MIT, upstream"

