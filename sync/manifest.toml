# Every Lua file in upstream's src/, where it is ported and the upstream commit
# the port is in sync with. Checked by sync/check.py; see docs/design.md.
#
# status: ported (fully), partial, data (read by the importer), todo, skip
# port: paths in this repository, separated by spaces
#
# Statuses track the engine's typed port, and for UI classes the web UI's view
# of them (the UI logic itself runs translated, driven by crates/session). Independently of them, crates/upstream
# translates upstream's whole program to Rust at build time (luagen), so that
# translation is always in sync with the submodule; see docs/design.md.

